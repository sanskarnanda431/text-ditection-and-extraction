<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | AI Text Detection Pro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="auth-wrap">
    <form class="auth-card" id="signupForm">
      <h1>Create Account</h1>
      <p>Join now and start extracting text in seconds.</p>

      <label>Full Name</label>
      <input id="signupName" type="text" placeholder="John Doe" required />

      <label>Email</label>
      <input id="signupEmail" type="email" placeholder="you@example.com" required />

      <label>Password</label>
      <input id="signupPassword" type="password" placeholder="Minimum 6 characters" minlength="6" required />

      <button class="btn btn-green auth-btn" type="submit">Create Account</button>
      <p class="auth-alt">Already have an account? <a href="login.html">Login</a></p>
      <p class="status" id="signupMsg"></p>
    </form>
  </main>

  <script src="auth.js"></script>
</body>
</html>
