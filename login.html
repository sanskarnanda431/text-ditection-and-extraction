<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | AI Text Detection Pro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="auth-wrap">
    <form class="auth-card" id="loginForm">
      <h1>Welcome Back</h1>
      <p>Login to continue to your text extraction dashboard.</p>

      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="you@example.com" required />

      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="••••••••" required />

      <button class="btn btn-cyan auth-btn" type="submit">Login</button>
      <p class="auth-alt">Don't have an account? <a href="signup.html">Sign up</a></p>
      <p class="status" id="loginMsg"></p>
    </form>
  </main>

  <script src="auth.js"></script>
</body>
</html>
